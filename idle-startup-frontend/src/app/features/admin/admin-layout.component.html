<div class="shell">
  <header class="topbar">
    <div class="topbar__inner">
      <a routerLink="/admin" class="brand" aria-label="Rich Life admin — overview">
        <span class="brand__mark"><app-icon name="shield" [size]="18" /></span>
        <span class="brand__name">Rich Life</span>
        <span class="staff-badge">Admin</span>
      </a>

      <nav class="topnav" aria-label="Admin">
        @for (s of sections; track s.path) {
          <a [routerLink]="s.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: s.exact }" class="topnav__link">
            <app-icon [name]="s.icon" [size]="18" />
            {{ s.label }}
          </a>
        }
      </nav>

      <div class="user staff-user">
        <span class="user__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="user__name">{{ auth.currentUser()?.username }}</span>
        <button type="button" class="icon-btn" aria-label="Log out" title="Log out" (click)="logout()">
          <app-icon name="logout" />
        </button>
      </div>
    </div>
  </header>

  <main class="shell__content">
    <div class="page">
      <header class="page-header">
        <h1>{{ heading() }}</h1>
        @if (blurb()) { <p>{{ blurb() }}</p> }
      </header>
      <router-outlet />
    </div>
  </main>

  <nav class="tabbar" aria-label="Admin (mobile)">
    @for (s of sections; track s.path) {
      <a [routerLink]="s.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: s.exact }" class="tabbar__link">
        <app-icon [name]="s.icon" [size]="22" />
        <span>{{ s.label }}</span>
      </a>
    }
  </nav>
</div>
